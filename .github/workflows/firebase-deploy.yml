name: Deploy to Firebase Hosting

# This workflow deploys the Next.js app to Firebase Hosting
# TODO: Move FIREBASE_TOKEN to GitHub Secrets for security

on:
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch: # Allows manual triggering from GitHub Actions tab

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js app
        working-directory: ./frontend
        run: npm run build
        # Next.js will output static files to the 'out' directory

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        working-directory: ./frontend
        env:
          # TODO: Replace with GitHub Secret: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_TOKEN: 1//0ghwiDD1TArcvCgYIARAAGBASNgF-L9IrWVgI1J0GMpeXSwMvEql7A_cSkZB103CGcFiRzJSJvehmOatlCq04TI9Ip8Q_t1mlUA
          # TODO: Replace with GitHub Secret: ${{ secrets.FIREBASE_PROJECT }}
          FIREBASE_PROJECT: sample-project-5bea9
        run: |
          firebase deploy --only hosting \
            --project "$FIREBASE_PROJECT" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive