name: Deploy to Firebase Hosting
# This workflow deploys the Next.js app to Firebase Hosting
# TODO: Move FIREBASE_TOKEN to GitHub Secrets for security

on:
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch: # Allows manual triggering from GitHub Actions tab

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        # If using `next export`, output will be in `out/`

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          # ❗ Move these to GitHub Secrets ASAP
          FIREBASE_TOKEN: 1//0ghwiDD1TArcvCgYIARAAGBASNgF-L9IrWVgI1J0GMpeXSwMvEql7A_cSkZB103CGcFiRzJSJvehmOatlCq04TI9Ip8Q_t1mlUA
          FIREBASE_PROJECT: sample-project-5bea9
        run: |
          firebase deploy --only hosting \
            --project "$FIREBASE_PROJECT" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive
